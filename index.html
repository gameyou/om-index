<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O&M Index</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:#ffffff;
    font-family:Arial,sans-serif;
    padding:24px;
}

.container{
    max-width:1400px;
    margin:0 auto;
}

.layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
}

.sidebar{
    width:240px;
    background:#151515;
    border-radius:18px;
    padding:20px;
    position:sticky;
    top:24px;
}

.sidebar h2{
    margin-top:0;
    margin-bottom:18px;
    font-size:20px;
}

.stock-list{
    list-style:none;
    padding:0;
    margin:0;
}

.stock-list li{
    padding:10px 0;
    border-bottom:1px solid #2a2a2a;
    font-size:15px;
}

.main-content{
    flex:1;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:24px;
    gap:20px;
}

h1{
    margin:0;
    font-size:56px;
}

.info{
    margin-top:16px;
    color:#b0b0b0;
    line-height:1.7;
}

.buttons{
    display:flex;
    gap:12px;
}

button{
    background:#1c1c1c;
    color:#fff;
    border:1px solid #333;
    border-radius:14px;
    padding:14px 24px;
    cursor:pointer;
    font-size:18px;
    transition:0.2s;
}

button:hover{
    background:#2d2d2d;
}

button.active{
    background:#ffffff;
    color:#000000;
}

.chart-box{
    background:#151515;
    border-radius:24px;
    padding:24px;
}

#error{
    margin-top:16px;
    color:#ff6666;
}

canvas{
    width:100%;
    height:700px;
}

</style>
</head>

<body>

<div class="container">

    <div class="layout">

        <div class="sidebar">

            <h2>構成銘柄</h2>

            <ul class="stock-list" id="stockList">
                <li>Loading...</li>
            </ul>

        </div>

        <div class="main-content">

            <div class="header">

                <div>

                    <h1>O&M Index</h1>

                    <div class="info" id="info">
                        Loading...
                    </div>

                </div>

                <div class="buttons">

                    <button class="active" onclick="switchPeriod('daily', this)">
                        日足
                    </button>

                    <button onclick="switchPeriod('weekly', this)">
                        週足
                    </button>

                    <button onclick="switchPeriod('monthly', this)">
                        月足
                    </button>

                </div>

            </div>

            <div class="chart-box">
                <canvas id="chart"></canvas>
            </div>

            <div id="error"></div>

        </div>

    </div>

</div>

<script>

let chart;
let allData;

async function loadData(){

    try{

        const response = await fetch("data.json?" + Date.now());

        allData = await response.json();

        document.getElementById("info").innerHTML = `
            最終更新: ${allData.updated_at}<br>
            指数方式: 時価総額加重平均 / 基準日 ${allData.base_date} = 100
        `;

        const stockList = document.getElementById("stockList");

        stockList.innerHTML = "";

        allData.stocks.forEach(stock => {

            const li = document.createElement("li");

            li.textContent = stock;

            stockList.appendChild(li);

        });

        drawChart("daily");

    }catch(e){

        console.error(e);

        document.getElementById("error").textContent =
            "エラー: " + e.message;

    }

}

function switchPeriod(period, btn){

    document.querySelectorAll("button").forEach(b => {
        b.classList.remove("active");
    });

    btn.classList.add("active");

    drawChart(period);

}

function drawChart(period){

    const ctx = document.getElementById("chart");

    const data = allData[period];

    if(!data){

        document.getElementById("error").textContent =
            period + " のデータがありません";

        return;
    }

    document.getElementById("error").textContent = "";

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {

        type:"line",

        data:{
            labels:data.labels,

            datasets:[{
                label:"O&M Index",
                data:data.values,
                borderWidth:3,
                tension:0.1
            }]
        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:"#ffffff"
                    }
                }
            },

            scales:{

                x:{
                    ticks:{
                        color:"#cccccc"
                    },
                    grid:{
                        color:"#2a2a2a"
                    }
                },

                y:{
                    ticks:{
                        color:"#cccccc"
                    },
                    grid:{
                        color:"#2a2a2a"
                    }
                }

            }

        }

    });

}

loadData();

</script>

</body>
</html>
