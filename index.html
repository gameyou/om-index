<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&M Index</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial, sans-serif;
  padding:24px;
}

.container{
  max-width:1100px;
  margin:0 auto;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:34px;
}

.buttons{
  display:flex;
  gap:8px;
}

button{
  background:#222;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
  padding:10px 18px;
  cursor:pointer;
  font-size:15px;
}

button.active{
  background:#fff;
  color:#111;
}

.info{
  color:#aaa;
  margin-bottom:14px;
  font-size:14px;
}

.chart-box{
  background:#1a1a1a;
  border-radius:14px;
  padding:20px;
  height:540px;
}

canvas{
  width:100% !important;
  height:100% !important;
}

.error{
  color:#ff7777;
  margin-top:16px;
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>O&amp;M Index</h1>
    <div class="buttons">
      <button id="dailyBtn" class="active" onclick="changePeriod('daily')">日足</button>
      <button id="weeklyBtn" onclick="changePeriod('weekly')">週足</button>
      <button id="monthlyBtn" onclick="changePeriod('monthly')">月足</button>
    </div>
  </div>

  <div class="info" id="info">Loading...</div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
let chart;
let allData;

async function loadData(){
  try{
    const res = await fetch("./data.json?cache=" + Date.now());

    if(!res.ok){
      throw new Error("data.json が読み込めません");
    }

    allData = await res.json();

    document.getElementById("info").textContent =
      "最終更新: " + allData.updated_at + " / 構成銘柄: " + allData.stocks.join(", ");

    drawChart("daily");

  }catch(e){
    document.getElementById("error").textContent =
      "エラー: " + e.message;
  }
}

function changePeriod(period){
  drawChart(period);

  document.getElementById("dailyBtn").classList.remove("active");
  document.getElementById("weeklyBtn").classList.remove("active");
  document.getElementById("monthlyBtn").classList.remove("active");

  document.getElementById(period + "Btn").classList.add("active");
}

function drawChart(period){
  const data = allData[period];

  if(!data || !data.labels || !data.values){
    document.getElementById("error").textContent =
      period + " のデータがありません";
    return;
  }

  if(chart){
    chart.destroy();
  }

  chart = new Chart(document.getElementById("chart"), {
    type:"line",
    data:{
      labels:data.labels,
      datasets:[{
        label:"O&M",
        data:data.values,
        borderWidth:2,
        pointRadius:0,
        tension:0.2
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{
        mode:"index",
        intersect:false
      },
      plugins:{
        legend:{
          labels:{ color:"#fff" }
        },
        tooltip:{
          callbacks:{
            label:function(context){
              return "O&M: " + context.parsed.y.toLocaleString() + "円";
            }
          }
        }
      },
      scales:{
        x:{
          ticks:{
            color:"#ccc",
            maxTicksLimit:12
          },
          grid:{
            color:"#333"
          }
        },
        y:{
          ticks:{
            color:"#ccc",
            callback:function(value){
              return value.toLocaleString();
            }
          },
          grid:{
            color:"#333"
          }
        }
      }
    }
  });
}

loadData();
</script>
</body>
</html>
