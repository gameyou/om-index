<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&M Index</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial, sans-serif;
  padding:24px;
}
.container{
  max-width:1100px;
  margin:auto;
}
canvas{
  background:#1b1b1b;
  border-radius:12px;
  padding:16px;
}
</style>
</head>
<body>
<div class="container">
  <h1>O&M Index</h1>
  <canvas id="chart"></canvas>
</div>

<script>
async function loadChart(){
  const res = await fetch("./data.json?cache=" + Date.now());
  const data = await res.json();

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [{
        label: "O&M",
        data: data.values,
        borderWidth: 2,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { ticks: { color: "#ccc" } },
        y: { ticks: { color: "#ccc" } }
      },
      plugins: {
        legend: { labels: { color: "#fff" } }
      }
    }
  });
}

loadChart();
</script>
</body>
</html>
