<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O&M Index</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:14px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
}

h1{
    margin:0 0 8px 0;
    font-size:52px;
}

.info{
    color:#bdbdbd;
    line-height:1.5;
    font-size:14px;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-size:16px;
}

button.active{
    background:white;
    color:black;
}

.chart-box{
    background:#151515;
    border-radius:20px;
    padding:14px;
    margin-top:18px;
}

canvas{
    width:100% !important;
    height:620px !important;
}

.section-title{
    margin-top:20px;
    margin-bottom:10px;
    font-size:22px;
}

.stock-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:8px;
}

.stock-card{
    background:#151515;
    border-radius:12px;
    padding:10px 12px;
}

.stock-name{
    font-size:13px;
    color:#cccccc;
    margin-bottom:4px;
}

.stock-weight{
    font-size:20px;
    font-weight:bold;
}

#error{
    margin-top:12px;
    color:#ff6666;
}

/* スマホ */

@media (max-width:768px){

    .container{
        padding:10px;
    }

    h1{
        font-size:34px;
    }

    .controls{
        width:100%;
        justify-content:space-between;
    }

    button{
        flex:1;
        padding:10px 0;
        font-size:14px;
    }

    canvas{
        height:320px !important;
    }

    .chart-box{
        padding:8px;
    }

    .stock-grid{
        grid-template-columns:repeat(2,1fr);
        gap:6px;
    }

    .stock-card{
        padding:8px;
    }

    .stock-name{
        font-size:11px;
    }

    .stock-weight{
        font-size:16px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <div>

            <h1>O&M Index</h1>

            <div class="info" id="info">
                Loading...
            </div>

        </div>

        <div class="controls">

            <button class="active" onclick="switchPeriod('daily', this)">
                日足
            </button>

            <button onclick="switchPeriod('weekly', this)">
                週足
            </button>

            <button onclick="switchPeriod('monthly', this)">
                月足
            </button>

        </div>

    </div>

    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

    <div id="error"></div>

    <div class="section-title">
        構成銘柄ウェイト
    </div>

    <div class="stock-grid" id="stockGrid">
    </div>

</div>

<script>

let chart;
let allData;

async function loadData(){

    try{

        const response = await fetch("data.json?" + Date.now());

        allData = await response.json();

        document.getElementById("info").innerHTML = `
            最終更新: ${allData.updated_at}<br>
            基準日: ${allData.base_date} = 100<br>
            指数方式: 時価総額加重平均
        `;

        renderStocks();

        drawChart("daily");

    }catch(e){

        console.error(e);

        document.getElementById("error").textContent =
            "エラー: " + e.message;

    }

}

function renderStocks(){

    const grid = document.getElementById("stockGrid");

    grid.innerHTML = "";

    const weights = allData.latest_weights_percent;

    const sorted = Object.entries(weights)
        .sort((a,b)=>b[1]-a[1]);

    sorted.forEach(item=>{

        const [name,weight] = item;

        const card = document.createElement("div");

        card.className = "stock-card";

        card.innerHTML = `
            <div class="stock-name">
                ${name}
            </div>

            <div class="stock-weight">
                ${weight}%
            </div>
        `;

        grid.appendChild(card);

    });

}

function switchPeriod(period, btn){

    document.querySelectorAll("button").forEach(b=>{
        b.classList.remove("active");
    });

    btn.classList.add("active");

    drawChart(period);

}

function drawChart(period){

    const ctx = document.getElementById("chart");

    const data = allData[period];

    if(!data){

        document.getElementById("error").textContent =
            period + " のデータがありません";

        return;

    }

    document.getElementById("error").textContent = "";

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {

        type:"line",

        data:{
            labels:data.labels,

            datasets:[{
                label:"O&M Index",
                data:data.values,
                borderWidth:3,
                tension:0.08,
                pointRadius:0,
                pointHoverRadius:0
            }]
        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            interaction:{
                mode:'index',
                intersect:false
            },

            plugins:{

                legend:{
                    labels:{
                        color:"#ffffff"
                    }
                },

                zoom:{

                    pan:{
                        enabled:true,
                        mode:'x'
                    },

                    zoom:{
                        pinch:{
                            enabled:true
                        },

                        wheel:{
                            enabled:false
                        },

                        mode:'x'
                    }
                }

            },

            scales:{

                x:{
                    ticks:{
                        color:"#cccccc",
                        maxTicksLimit:10
                    },

                    grid:{
                        color:"#4a4a4a"
                    }
                },

                y:{
                    ticks:{
                        color:"#cccccc"
                    },

                    grid:{
                        color:(ctx)=>{

                            if(ctx.tick.value === 100){
                                return "#ffffff";
                            }

                            return "#4a4a4a";
                        },

                        lineWidth:(ctx)=>{

                            if(ctx.tick.value === 100){
                                return 2.5;
                            }

                            return 1.2;
                        }
                    }
                }

            }

        }

    });

}

loadData();

</script>

</body>
</html>
