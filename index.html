<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:16px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
}

h1{
    margin:0 0 10px 0;
    font-size:52px;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:14px 22px;
    cursor:pointer;
    font-size:18px;
}

button.active{
    background:white;
    color:black;
}

.layout{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.sidebar{
    width:260px;
    background:#151515;
    border-radius:16px;
    padding:16px;
    flex-shrink:0;
}

.sidebar h2{
    margin-top:0;
    font-size:22px;
}

.stock-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.stock-item{
    padding:10px;
    background:#202020;
    border-radius:10px;
    font-size:15px;
}

.chart-area{
    flex:1;
    min-width:0;
}

.chart-box{
    background:#151515;
    border-radius:20px;
    padding:20px;
    overflow-x:auto;
}

canvas{
    width:100% !important;
    height:650px !important;
}

/* スマホ */
@media (max-width: 768px){

    h1{
        font-size:38px;
    }

    .layout{
        flex-direction:column;
    }

    .sidebar{
        width:auto;
    }

    .controls{
        width:100%;
        justify-content:space-between;
    }

    button{
        flex:1;
        padding:12px 0;
        font-size:16px;
    }

    canvas{
        height:320px !important;
    }

    .chart-box{
        padding:10px;
    }

    .stock-item{
        font-size:14px;
    }
}
</style>
