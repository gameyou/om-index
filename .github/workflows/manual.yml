name: Update O&M Index

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install yfinance pandas

      - name: Create data.json
        run: |
          python <<'EOF'
          import json
          from datetime import datetime, timezone, timedelta
          import pandas as pd
          import yfinance as yf

          stocks = {
              "ヤクルト本社": "2267.T",
              "日清食品HD": "2897.T",
              "アサヒGHD": "2502.T",
              "共立メンテナンス": "9616.T",
              "積水化学工業": "4204.T",
              "ゴールドウイン": "8111.T",
              "富士フイルムHD": "4901.T",
              "フィックスターズ": "3687.T"
          }

          shares = {
              "2267.T": 292104288,
              "2897.T": 287057156,
              "2502.T": 1462866952,
              "9616.T": 87730913,
              "4204.T": 403705986,
              "8111.T": 136740731,
              "4901.T": 1205328866,
              "3687.T": 32252858
          }

          tickers = list(stocks.values())
          name_by_ticker = {ticker: name for name, ticker in stocks.items()}
          base_start = "2025-01-01"

          raw = yf.download(
              tickers,
              start=base_start,
              interval="1d",
              auto_adjust=False,
              progress=False,
              threads=False
          )

          prices = raw["Close"]

          if isinstance(prices, pd.Series):
              prices = prices.to_frame()

          prices = prices.reindex(columns=tickers)
          prices = prices.dropna(how="any")

          if prices.empty:
              raise Exception("株価データを取得できませんでした")

          market_caps = pd.DataFrame(index=prices.index)

          for ticker in tickers:
              market_caps[ticker] = prices[ticker] * shares[ticker]

          total_market_cap = market_caps.sum(axis=1)

          base_date = total_market_cap.index[0]
          base_value = total_market_cap.loc[base_date]

          om_daily = total_market_cap / base_value * 100
          om_weekly = om_daily.resample("W-FRI").last().dropna()
          om_monthly = om_daily.resample("ME").last().dropna()

          def convert(series):
              return {
                  "labels": series.index.strftime("%Y-%m-%d").tolist(),
                  "values": [round(float(v), 2) for v in series.tolist()]
              }

          latest_date = prices.index[-1]
          latest_value = om_daily.loc[latest_date]

          latest_caps = market_caps.loc[latest_date]
          latest_total = latest_caps.sum()

          weights = {}
          components = []

          for ticker in tickers:
              name = name_by_ticker[ticker]
              base_price = prices.loc[base_date, ticker]
              latest_price = prices.loc[latest_date, ticker]
              latest_cap = market_caps.loc[latest_date, ticker]

              weights[name] = round(float(latest_cap / latest_total * 100), 2)

              components.append({
                  "name": name,
                  "ticker": ticker,
                  "shares": int(shares[ticker]),
                  "base_price": round(float(base_price), 2),
                  "latest_price": round(float(latest_price), 2),
                  "latest_market_cap": round(float(latest_cap), 2),
                  "latest_weight_percent": round(float(latest_cap / latest_total * 100), 2)
              })

          jst = timezone(timedelta(hours=9))

          result = {
              "name": "O&M Index",
              "method": "Market-cap weighted index, base=100",
              "base_start": base_start,
              "base_date": base_date.strftime("%Y-%m-%d"),
              "base_value": 100,
              "latest_date": latest_date.strftime("%Y-%m-%d"),
              "latest_value": round(float(latest_value), 2),
              "updated_at": datetime.now(jst).strftime("%Y-%m-%d %H:%M:%S JST"),
              "stocks": list(stocks.keys()),
              "shares": {
                  name_by_ticker[ticker]: int(shares[ticker])
                  for ticker in tickers
              },
              "latest_weights_percent": weights,
              "components": components,
              "daily": convert(om_daily),
              "weekly": convert(om_weekly),
              "monthly": convert(om_monthly)
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("base_date:", base_date.strftime("%Y-%m-%d"))
          print("latest_date:", latest_date.strftime("%Y-%m-%d"))
          print("latest_value:", round(float(latest_value), 2))
          print("data.json created")
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git commit -m "Update O&M market-cap weighted index" || echo "No changes"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
