name: Update O&M Index

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install yfinance pandas

      - name: Create data.json
        run: |
          python <<'EOF'
          import json
          from datetime import datetime, timezone, timedelta
          import pandas as pd
          import yfinance as yf

          stocks = {
              "ヤクルト本社": "2267.T",
              "日清食品HD": "2897.T",
              "アサヒGHD": "2502.T",
              "共立メンテナンス": "9616.T",
              "積水化学工業": "4204.T",
              "ゴールドウイン": "8111.T",
              "富士フイルムHD": "4901.T",
              "フィックスターズ": "3687.T"
          }

          tickers = list(stocks.values())
          base_start = "2025-01-01"

          prices = yf.download(
              tickers,
              start=base_start,
              interval="1d",
              auto_adjust=True,
              progress=False,
              threads=True
          )["Close"].dropna(how="any")

          if prices.empty:
              raise Exception("株価データを取得できませんでした")

          shares = {}

          for name, ticker in stocks.items():
              t = yf.Ticker(ticker)
              s = None

              try:
                  s = t.fast_info.get("shares")
              except Exception:
                  pass

              if not s:
                  try:
                      s = t.info.get("sharesOutstanding")
                  except Exception:
                      pass

              if not s:
                  raise Exception(f"{name} の発行済株式数を取得できません: {ticker}")

              shares[ticker] = float(s)

          shares_series = pd.Series(shares)

          market_caps = prices.mul(shares_series, axis=1)
          total_market_cap = market_caps.sum(axis=1)

          base_date = total_market_cap.index[0]
          base_value = total_market_cap.iloc[0]

          om_daily = total_market_cap / base_value * 100
          om_weekly = om_daily.resample("W-FRI").last().dropna()
          om_monthly = om_daily.resample("ME").last().dropna()

          def convert(series):
              return {
                  "labels": series.index.strftime("%Y-%m-%d").tolist(),
                  "values": [round(float(v), 2) for v in series.tolist()]
              }

          latest_date = prices.index[-1]
          latest_caps = market_caps.loc[latest_date]
          latest_total = latest_caps.sum()

          weights = {
              stocks[ticker]: round(float(latest_caps[ticker] / latest_total * 100), 2)
              for ticker in tickers
          }

          jst = timezone(timedelta(hours=9))

          result = {
              "name": "O&M Index",
              "method": "Market-cap weighted index, base=100",
              "base_start": base_start,
              "base_date": base_date.strftime("%Y-%m-%d"),
              "base_value": 100,
              "updated_at": datetime.now(jst).strftime("%Y-%m-%d %H:%M:%S JST"),
              "stocks": list(stocks.keys()),
              "shares": {
                  stocks[ticker]: int(shares[ticker])
                  for ticker in tickers
              },
              "latest_weights_percent": weights,
              "daily": convert(om_daily),
              "weekly": convert(om_weekly),
              "monthly": convert(om_monthly)
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git commit -m "Update O&M market-cap weighted index" || echo "No changes"
          git push
